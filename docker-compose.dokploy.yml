# Dokploy deployment (Hostinger VPS): PostgreSQL + the single app image (API +
# built React app). Step-by-step guide: docs/deploy-dokploy.md
#
# In Dokploy: Create Service -> Compose, provider = this Git repo,
# Compose Path = ./docker-compose.dokploy.yml. Set the variables below in the
# service's Environment tab, then add the domain in the Domains tab
# (service "app", port 4000, HTTPS on).
#
# Persistent data lives in plain folders on the VPS disk (bind mounts), outside
# Dokploy's checkout, so redeploys and rebuilds never touch it:
#   ${DATA_DIR}/uploads   uploaded files     (default /srv/eithm/uploads)
#   ${DATA_DIR}/postgres  database files     (default /srv/eithm/postgres)
#
# Required variables:
#   POSTGRES_PASSWORD  letters and digits only (it goes into a URL)
#   JWT_SECRET         32+ random characters
# Optional:
#   DATA_DIR           base folder on the VPS (default /srv/eithm)
#   PASSWORD_ENC_KEY   defaults to JWT_SECRET (see .env.example)

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy's Environment tab}
    volumes:
      - ${DATA_DIR:-/srv/eithm}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the internet - only the app reaches it.

  # One-shot: makes sure the uploads folder exists on the VPS and belongs to
  # the app's user (uid 1000, "node"), which can't write to a root-owned
  # folder. Exits immediately; "app" waits for it.
  storage-init:
    image: busybox:1.37
    restart: "no"
    command: ["sh", "-c", "mkdir -p /data/uploads && chown 1000:1000 /data/uploads"]
    volumes:
      - ${DATA_DIR:-/srv/eithm}/uploads:/data/uploads

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://portal:${POSTGRES_PASSWORD}@db:5432/portal?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Dokploy's Environment tab}
      PASSWORD_ENC_KEY: ${PASSWORD_ENC_KEY:-${JWT_SECRET}}
      # Set by the Dockerfile too; repeated here so the mount below is explicit.
      STORAGE_ROOT: /data/uploads
      # Served over HTTPS by Dokploy's Traefik, so secure cookies stay on
      # (the production default). Don't set COOKIE_SECURE.
    expose:
      - "4000"
    volumes:
      - ${DATA_DIR:-/srv/eithm}/uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Migrations run on start before the server listens.
      start_period: 60s
    networks:
      - default
      - dokploy-network

networks:
  # Dokploy's Traefik routes the domain to "app" over this network.
  dokploy-network:
    external: true
