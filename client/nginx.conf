# nginx config for the frontend image (client/Dockerfile).
# Same caching as the single-container mode in server/src/app.ts:
# content-hashed assets cached forever, the SPA shell never cached.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # Container health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # /api belongs to the backend service. If a request reaches nginx, the
    # proxy's /api route is missing - fail clearly instead of returning the
    # SPA shell as "JSON".
    location /api/ {
        default_type application/json;
        return 502 '{"error":"API route not configured at the proxy"}';
    }

    # Vite's content-hashed bundles.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA: real files are served as-is, every other path gets index.html
    # (React Router handles it). The shell itself is never cached.
    location / {
        try_files $uri $uri/ @spa;
        expires 1d;
    }

    location @spa {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
